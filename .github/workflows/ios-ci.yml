name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    env:
      PROJECT: ParasiteIDApp.xcodeproj
      SCHEME: ParasiteIDApp
    steps:
      - uses: actions/checkout@v4

      # Pinned: the runner's default python has no prebuilt h5py wheel, so pip falls back to
      # building it from source and fails looking for libhdf5.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the Core ML model matches its checkpoint
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy h5py
          python tools/verify_coreml_model.py \
            EfficientNetB0.keras ios/ParasiteIDApp/ParasiteNits.mlpackage

      - name: Show Xcode and available simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build.log

      - name: Detect test targets
        id: detect
        run: |
          if grep -q "com.apple.product-type.bundle.unit-test\|com.apple.product-type.bundle.ui-testing" "$PROJECT/project.pbxproj"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::error::ParasiteIDAppTests has gone missing from the project - the model and the decision band are no longer covered."
          fi

      - name: Test
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee test.log

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-logs
          path: |
            ios/build.log
            ios/test.log
            ios/TestResults.xcresult
          if-no-files-found: ignore
